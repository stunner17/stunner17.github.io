<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  {% seo title=false %}
  <script>document.documentElement.classList.add('js')</script>
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  {{ content }}
  <footer class="footer">
    <div class="wrap footer-inner">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</span>
      <span>Last updated {{ site.time | date: '%B %Y' }}</span>
    </div>
  </footer>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
